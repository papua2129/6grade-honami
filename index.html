<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小学校6年生 学習プリント</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="小学校6年生 学習プリント">
        <span class="brand-mark" aria-hidden="true">6</span>
        <span>
          <span class="brand-title">小学校6年生 学習プリント</span>
          <span class="brand-subtitle">国語・公民・歴史</span>
        </span>
      </a>
      <nav class="top-nav" aria-label="ページ">
        <a href="index.html" aria-current="page">問題</a>
        <a href="print.html">プリント</a>
        <a href="answers.html">模範回答</a>
      </nav>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="学習メニュー">
        <div class="sidebar-block">
          <h1>今日の学習</h1>
          <p id="siteSummary">学習指導要領と単元評価資料をもとにした、6年生向けの練習問題です。</p>
        </div>

        <div class="sidebar-block">
          <h2>教科</h2>
          <div class="subject-tabs" id="subjectTabs"></div>
        </div>

        <div class="sidebar-block">
          <label class="field-label" for="unitSelect">単元</label>
          <select id="unitSelect" class="select"></select>
        </div>

        <div class="sidebar-block stat-grid" id="subjectStats"></div>
      </aside>

      <section class="study-area" aria-label="問題">
        <div class="study-toolbar">
          <div>
            <p class="eyebrow" id="currentSubjectLabel">社会・公民</p>
            <h2 id="currentUnitTitle">日本国憲法</h2>
          </div>
          <div class="toolbar-actions">
            <a class="icon-link" id="printLink" href="print.html">印刷</a>
            <a class="icon-link" id="answersLink" href="answers.html">解答</a>
          </div>
        </div>

        <article class="question-panel">
          <div class="question-topline">
            <span class="pill" id="questionCategory">三つの原則</span>
            <span class="progress" id="questionProgress">1 / 1</span>
          </div>

          <p class="question-text" id="questionText"></p>
          <div class="choice-list" id="choiceList"></div>
          <div class="write-box" id="writeBox" hidden>
            <label for="studentAnswer">自分の答え</label>
            <textarea id="studentAnswer" rows="4"></textarea>
          </div>

          <div class="answer-box" id="answerBox" hidden>
            <p class="answer-label">模範回答</p>
            <p class="answer-text" id="answerText"></p>
            <p class="explanation" id="answerExplanation"></p>
          </div>

          <div class="question-controls" aria-label="問題操作">
            <button type="button" class="control-button ghost" id="prevQuestion">前へ</button>
            <button type="button" class="control-button primary" id="toggleAnswer">答えを見る</button>
            <button type="button" class="control-button ghost" id="randomQuestion">ランダム</button>
            <button type="button" class="control-button solid" id="nextQuestion">次へ</button>
          </div>
        </article>

        <section class="learning-map" aria-label="学習の見取り図">
          <div class="map-heading">
            <h2>単元の見取り図</h2>
            <p id="mapSummary"></p>
          </div>
          <div class="map-grid" id="unitMap"></div>
        </section>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
